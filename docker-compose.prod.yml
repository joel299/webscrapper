services:
  api:
    image: ${IMAGE_NAME:-soueujoe/webscrapper}:${IMAGE_TAG:-0.0.0.1}
    environment:
      NODE_ENV: production
      PORT: 3001
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/webscrapper
      REDIS_URL: redis://redis:6379
      SCRAPER_CONCURRENCY: 3
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/index.js"]
    depends_on:
      - db
      - redis
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webscrapper.rule=Host(`web.iainfinito.com.br`)"
      - "traefik.http.routers.webscrapper.entrypoints=websecure"
      - "traefik.http.routers.webscrapper.tls=true"
      - "traefik.http.services.webscrapper.loadbalancer.server.port=3001"
    networks:
      - network_public

  worker:
    image: ${IMAGE_NAME:-soueujoe/webscrapper}:${IMAGE_TAG:-0.0.0.1}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/webscrapper
      REDIS_URL: redis://redis:6379
      SCRAPER_CONCURRENCY: 3
    command: ["node", "dist/workers/worker.js"]
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - network_public

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: webscrapper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webscrapper"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - network_public

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - network_public

volumes:
  db_data:
  redis_data:

networks:
  network_public:
    external: true
