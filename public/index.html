<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebScrapper — Editais</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #101114; color: #f3f4f6; }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 60px; }
    h1 { margin: 0 0 6px; font-size: 30px; }
    p { color: #aeb4c0; }
    .card { background: #191b21; border: 1px solid #2b2f38; border-radius: 12px; padding: 18px; margin-top: 18px; }
    .grid { display: grid; grid-template-columns: 1.3fr 1fr 1.5fr 110px; gap: 10px; }
    label { display: grid; gap: 6px; color: #aeb4c0; font-size: 13px; }
    input, select, button { border-radius: 8px; border: 1px solid #3b414d; padding: 10px 12px; font: inherit; }
    input, select { background: #101114; color: #fff; }
    button { background: #c9a227; color: #161616; border-color: #c9a227; cursor: pointer; font-weight: 700; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
    .status { min-height: 22px; color: #c9a227; margin-top: 10px; }
    .auto { color: #8b93a1; font-size: 13px; }
    .sources { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .source { border: 1px solid #3b414d; border-radius: 999px; color: #c9a227; padding: 5px 10px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border-bottom: 1px solid #2b2f38; padding: 10px 8px; text-align: left; vertical-align: top; }
    th { color: #aeb4c0; font-size: 13px; }
    td a { color: #8ab4f8; }
    .muted { color: #8b93a1; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } table { display: block; overflow-x: auto; } }
  </style>
</head>
<body>
<main>
  <h1>WebScrapper</h1>
  <p>Consulta e coleta automática de editais públicos.</p>

  <section class="card">
    <strong>Fontes monitoradas automaticamente</strong>
    <div id="sources" class="sources"><span class="muted">Carregando fontes...</span></div>
    <div class="actions">
      <span class="auto">O sistema consulta todas as fontes configuradas e atualiza os resultados automaticamente.</span>
      <span id="lastUpdate" class="auto"></span>
    </div>
  </section>

  <section class="card">
    <strong>Filtros de visualização</strong>
    <div class="grid" style="margin-top:12px">
      <label>Fonte <select id="fonte"><option value="">Todas as fontes</option></select></label>
      <label>Status <input id="status" maxlength="50" placeholder="Todos"></label>
      <label>Texto <input id="texto" maxlength="200" placeholder="Buscar no título ou descrição"></label>
      <label>Limite <input id="limit" type="number" min="1" max="100" value="20"></label>
    </div>
    <div class="actions">
      <button id="search">Atualizar resultados</button>
      <span id="statusMessage" class="status" role="status"></span>
    </div>
  </section>

  <section class="card">
    <strong>Resultados <span id="total" class="muted"></span></strong>
    <table>
      <thead><tr><th>Título</th><th>Fonte</th><th>Status</th><th>Fechamento</th><th>Link</th></tr></thead>
      <tbody id="results"><tr><td colspan="5" class="muted">Carregando editais...</td></tr></tbody>
    </table>
  </section>
</main>
<script>
  const API_BASE = location.pathname.startsWith("/webscrapper") ? "/webscrapper" : "";
  const $ = (id) => document.getElementById(id);
  const statusMessage = (text, error = false) => { $("statusMessage").textContent = text; $("statusMessage").style.color = error ? "#f87171" : "#c9a227"; };
  const request = async (path, options = {}) => {
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data?.message || data?.error?.message || `HTTP ${response.status}`);
    return data;
  };
  const query = () => {
    const params = new URLSearchParams({ limit: $("limit").value || "20", page: "1" });
    for (const id of ["fonte", "status", "texto"]) if ($(id).value.trim()) params.set(id, $(id).value.trim());
    return params;
  };
  function labelSource(source) { return source.replaceAll("_", " ").replace(/\b\w/g, (char) => char.toUpperCase()); }
  function renderSources(sources) {
    const select = $("fonte");
    select.replaceChildren(new Option("Todas as fontes", ""));
    $("sources").replaceChildren();
    for (const source of sources) {
      select.append(new Option(labelSource(source), source));
      const badge = document.createElement("span"); badge.className = "source"; badge.textContent = labelSource(source); $("sources").append(badge);
    }
    if (!sources.length) $("sources").textContent = "Nenhuma fonte configurada.";
  }
  function render(data) {
    $("total").textContent = `(${data.total ?? 0})`;
    const tbody = $("results"); tbody.replaceChildren();
    if (!data.items?.length) { const row = tbody.insertRow(); const cell = row.insertCell(); cell.colSpan = 5; cell.className = "muted"; cell.textContent = "Nenhum edital encontrado."; return; }
    for (const item of data.items) {
      const row = tbody.insertRow();
      for (const value of [item.titulo, labelSource(item.fonte || ""), item.status, item.data_fechamento]) row.insertCell().textContent = value || "—";
      const link = row.insertCell();
      if (item.link_edital) { const anchor = document.createElement("a"); anchor.href = item.link_edital; anchor.target = "_blank"; anchor.rel = "noopener noreferrer"; anchor.textContent = "Abrir"; link.append(anchor); } else link.textContent = "—";
    }
  }
  async function loadSources() { renderSources((await request(`${API_BASE}/api/editais/sources`)).sources || []); }
  async function refresh() {
    try { render(await request(`${API_BASE}/api/editais/?${query()}`)); $("lastUpdate").textContent = `Atualizado às ${new Date().toLocaleTimeString("pt-BR")}`; statusMessage("Fontes sincronizadas automaticamente."); }
    catch (error) { statusMessage(error.message, true); }
  }
  $("search").onclick = refresh;
  for (const id of ["fonte", "status", "texto", "limit"]) $(id).addEventListener("change", refresh);
  (async () => { try { await loadSources(); await refresh(); setInterval(refresh, 15000); } catch (error) { statusMessage(error.message, true); } })();
</script>
</body>
</html>
